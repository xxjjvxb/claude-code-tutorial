# 주식 시뮬 자동 새 라운드 — 매일 05:00 KST(20:00 UTC)
# 체결·임팩트 삭제, 전원 잔고 100만 초기화, 시세 시드 교체.
# 키(stock_keys.key)는 유지 — 수강생 앱은 며칠 뒤에도 같은 키로 동작한다.
# 수동 실행: Actions 탭 → stock-reset → Run workflow (또는 board.html의 관리자 리셋 버튼)
name: stock-reset

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset market
        env:
          URL: https://khjevjuoudbsbkzrhfkx.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          auth=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json")
          curl -sf -X DELETE "$URL/rest/v1/stock_trades?id=gt.0"  "${auth[@]}"
          curl -sf -X DELETE "$URL/rest/v1/stock_impacts?id=gt.0" "${auth[@]}"
          curl -sf -X PATCH "$URL/rest/v1/stock_keys?key=not.is.null" "${auth[@]}" \
            -d '{"cash":1000000,"pos_a":0,"pos_b":0,"pos_c":0}'
          curl -sf -X PATCH "$URL/rest/v1/stock_config?id=eq.1" "${auth[@]}" \
            -d "{\"seed\":\"$(openssl rand -hex 16)\",\"epoch\":\"$(date -u +%FT%TZ)\"}"
          echo "reset ok"
