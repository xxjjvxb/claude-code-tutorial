<!doctype html>

<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의자료 관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; background: #faf7f2; color: #262220; padding: 2rem 1.2rem; word-break: keep-all; }
    .wrap { max-width: 58rem; margin: 0 auto; }
    .brand { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #cc5a14; }
    h1 { font-size: 1.3rem; margin: 0.3rem 0 1rem; }
    .tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
    .tab { appearance: none; cursor: pointer; border: 2px solid #e5ddd2; background: #fff; border-radius: 999px; font-size: 0.84rem; font-weight: 700; padding: 0.45rem 1rem; color: #797067; }
    .tab.on { border-color: #fe6e00; color: #cc5a14; background: #fff7ed; }
    .bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .chip { font-size: 0.78rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1.5px solid #e5ddd2; background: #fff; }
    .chip b { color: #cc5a14; }
    .spacer { flex: 1; }
    button, .btn { appearance: none; cursor: pointer; border-radius: 8px; border: 1.5px solid #e5ddd2; background: #fff; font-size: 0.8rem; font-weight: 700; padding: 0.45rem 0.8rem; color: #262220; }
    button:hover { border-color: #fe6e00; color: #cc5a14; }
    .approve { background: #fe6e00; border-color: #fe6e00; color: #fff; }
    .approve:hover { color: #fff; opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 2px solid #e5ddd2; border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; font-size: 0.84rem; padding: 0.65rem 0.8rem; border-bottom: 1px solid #f0e9df; vertical-align: top; }
    th { background: #f6f1e9; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: #797067; }
    tr:last-child td { border-bottom: none; }
    .st { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 999px; white-space: nowrap; }
    .st-pending, .st-open { background: #fff7ed; color: #9a3412; }
    .st-approved, .st-resolved { background: #f0fdf4; color: #166534; }
    .st-rejected { background: #fef2f2; color: #991b1b; }
    .ty { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 999px; white-space: nowrap; }
    .ty-question { background: #eff6ff; color: #1d4ed8; }
    .ty-report { background: #fef2f2; color: #991b1b; }
    .muted { color: #b0a79c; font-size: 0.74rem; }
    .content { white-space: pre-wrap; line-height: 1.5; max-width: 24rem; }
    tr.dim td { opacity: 0.55; }
    a.loc { color: #cc5a14; font-weight: 700; text-decoration: none; font-size: 0.8rem; }
    a.loc:hover { text-decoration: underline; }
    .notice { background: #fff; border: 2px solid #e5ddd2; border-radius: 12px; padding: 1.2rem; font-size: 0.9rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">클로드코드 실습으로 배우는 바이브코딩</div>
    <h1>강의자료 관리</h1>

    <div id="guard" class="notice">확인 중…</div>

    <div id="panel" class="hidden">
      <div class="tabs">
        <button class="tab on" id="tab-access">열람 신청</button>
        <button class="tab" id="tab-feedback">질문 · 신고</button>
        <span class="spacer"></span>
        <button id="btn-reload">새로고침</button>
        <button id="btn-signout">로그아웃</button>
      </div>

      <section id="sec-access">
        <div class="bar">
          <span class="chip">대기 <b id="c-pending">0</b></span>
          <span class="chip">승인 <b id="c-approved">0</b></span>
          <span class="chip">거절 <b id="c-rejected">0</b></span>
        </div>
        <table>
          <thead><tr><th>신청자</th><th>이메일</th><th>신청 시각</th><th>상태</th><th>처리</th></tr></thead>
          <tbody id="rows-access"></tbody>
        </table>
        <p class="muted" style="margin-top:0.6rem">승인/거절은 즉시 반영됩니다 — 승인된 사람은 로그인 페이지에서 바로 입장할 수 있습니다.</p>
      </section>

      <section id="sec-feedback" class="hidden">
        <div class="bar">
          <span class="chip">미처리 신고 <b id="c-report">0</b></span>
          <span class="chip">미처리 질문 <b id="c-question">0</b></span>
          <span class="chip">처리 완료 <b id="c-resolved">0</b></span>
        </div>
        <table>
          <thead><tr><th>유형</th><th>내용</th><th>위치</th><th>보낸 사람</th><th>처리</th></tr></thead>
          <tbody id="rows-feedback"></tbody>
        </table>
        <p class="muted" style="margin-top:0.6rem">위치를 누르면 해당 슬라이드가 새 탭으로 열립니다 — 검토 후 "처리 완료"로 정리하세요.</p>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_EMAIL, GATE_ENABLED } from '/auth-config.js';
    const $ = (id) => document.getElementById(id);
    if (!GATE_ENABLED) { $('guard').textContent = 'auth-config.js가 아직 설정되지 않았습니다 — ACCESS-SETUP.md를 참고하세요.'; throw new Error('gate disabled'); }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const fmt = (ts) => ts ? new Date(ts).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const esc = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

    async function guard() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        $('guard').innerHTML = '관리자 로그인이 필요합니다. <button id="g-login">구글로 로그인</button>';
        $('g-login').addEventListener('click', () =>
          sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/admin.html' } }));
        return false;
      }
      if ((session.user.email || '').toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        $('guard').textContent = '접근 권한이 없습니다. (' + (session.user.email || '') + ')';
        return false;
      }
      $('guard').classList.add('hidden');
      $('panel').classList.remove('hidden');
      return true;
    }

    // ---------- 열람 신청 ----------
    async function loadAccess() {
      const { data: rows, error } = await sb.from('access_requests')
        .select('user_id, email, name, status, requested_at, decided_at')
        .order('requested_at', { ascending: false });
      if (error) { alert('신청 목록 조회 실패: ' + error.message); return; }
      const counts = { pending: 0, approved: 0, rejected: 0 };
      const tbody = $('rows-access');
      tbody.innerHTML = '';
      for (const r of rows) {
        counts[r.status] = (counts[r.status] || 0) + 1;
        const tr = document.createElement('tr');
        const stLabel = { pending: '대기', approved: '승인됨', rejected: '거절됨' }[r.status] || r.status;
        tr.innerHTML =
          '<td>' + (r.name ? esc(r.name) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + esc(r.email) + '</td>' +
          '<td class="muted">' + fmt(r.requested_at) + '</td>' +
          '<td><span class="st st-' + r.status + '">' + stLabel + '</span>' +
            (r.decided_at ? '<div class="muted">' + fmt(r.decided_at) + '</div>' : '') + '</td>' +
          '<td></td>';
        const cell = tr.lastElementChild;
        if (r.status !== 'approved') {
          const b = document.createElement('button'); b.className = 'approve'; b.textContent = '승인';
          b.addEventListener('click', () => decideAccess(r.user_id, 'approved')); cell.appendChild(b);
        }
        if (r.status !== 'rejected') {
          const b = document.createElement('button'); b.textContent = r.status === 'approved' ? '승인 취소' : '거절';
          b.style.marginLeft = '0.4rem';
          b.addEventListener('click', () => decideAccess(r.user_id, 'rejected')); cell.appendChild(b);
        }
        tbody.appendChild(tr);
      }
      $('c-pending').textContent = counts.pending; $('c-approved').textContent = counts.approved; $('c-rejected').textContent = counts.rejected;
    }
    async function decideAccess(userId, status) {
      const { error } = await sb.from('access_requests')
        .update({ status, decided_at: new Date().toISOString() })
        .eq('user_id', userId);
      if (error) { alert('처리 실패: ' + error.message); return; }
      loadAccess();
    }

    // ---------- 질문 · 신고 ----------
    async function loadFeedback() {
      const { data: rows, error } = await sb.from('feedback')
        .select('id, email, type, deck_path, slide_no, page_title, content, status, created_at')
        .order('created_at', { ascending: false });
      if (error) { alert('질문·신고 조회 실패: ' + error.message); return; }
      const counts = { report: 0, question: 0, resolved: 0 };
      const tbody = $('rows-feedback');
      tbody.innerHTML = '';
      for (const r of rows) {
        if (r.status === 'resolved') counts.resolved++;
        else counts[r.type] = (counts[r.type] || 0) + 1;
        const tr = document.createElement('tr');
        if (r.status === 'resolved') tr.className = 'dim';
        const loc = r.deck_path + (r.slide_no ? '#slide=' + r.slide_no : '');
        tr.innerHTML =
          '<td><span class="ty ty-' + r.type + '">' + (r.type === 'report' ? '🚨 신고' : '💬 질문') + '</span></td>' +
          '<td class="content">' + esc(r.content) + '</td>' +
          '<td><a class="loc" href="' + esc(loc) + '" target="_blank" rel="noopener">' + esc(r.page_title || r.deck_path) +
            (r.slide_no ? ' · 슬라이드 ' + r.slide_no : '') + ' ↗</a></td>' +
          '<td class="muted">' + esc(r.email) + '<br>' + fmt(r.created_at) + '</td>' +
          '<td></td>';
        const cell = tr.lastElementChild;
        const b = document.createElement('button');
        if (r.status === 'resolved') {
          b.textContent = '다시 열기';
          b.addEventListener('click', () => decideFeedback(r.id, 'open'));
        } else {
          b.className = 'approve'; b.textContent = '처리 완료';
          b.addEventListener('click', () => decideFeedback(r.id, 'resolved'));
        }
        cell.appendChild(b);
        tbody.appendChild(tr);
      }
      $('c-report').textContent = counts.report; $('c-question').textContent = counts.question; $('c-resolved').textContent = counts.resolved;
    }
    async function decideFeedback(id, status) {
      const { error } = await sb.from('feedback')
        .update({ status, resolved_at: status === 'resolved' ? new Date().toISOString() : null })
        .eq('id', id);
      if (error) { alert('처리 실패: ' + error.message); return; }
      loadFeedback();
    }

    // ---------- 탭 · 공통 ----------
    function switchTab(which) {
      $('tab-access').classList.toggle('on', which === 'access');
      $('tab-feedback').classList.toggle('on', which === 'feedback');
      $('sec-access').classList.toggle('hidden', which !== 'access');
      $('sec-feedback').classList.toggle('hidden', which !== 'feedback');
    }
    $('tab-access').addEventListener('click', () => switchTab('access'));
    $('tab-feedback').addEventListener('click', () => switchTab('feedback'));
    $('btn-reload').addEventListener('click', () => { loadAccess(); loadFeedback(); });
    $('btn-signout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

    if (await guard()) { loadAccess(); loadFeedback(); }
  </script>
</body>
</html>
