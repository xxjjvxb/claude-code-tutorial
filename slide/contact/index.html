<!doctype html>
<!-- © 2026 이일규 (Ilkyu Lee). All rights reserved. 본 강의자료는 저작권법으로 보호되는 저작물입니다. 무단 복제·배포·재사용을 금합니다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="이일규">
  <meta name="copyright" content="© 2026 이일규 · 본 강의자료는 저작권법으로 보호되는 저작물입니다. 무단 복제·배포 금지.">
  <script defer src="../scripts/protect.js"></script>
  <title>문의하기 — 실습으로 배우는 바이브코딩 with 클로드코드</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/deck.css">
  <style>
    .ct-head { display: flex; flex-direction: column; gap: 0.3rem; flex-shrink: 0; margin-bottom: 0.9rem; }
    .ct-eyebrow { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--color-primary-strong); }
    .ct-title { font-size: 1.7rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; margin: 0.1rem 0 0.2rem 0; color: var(--color-on-surface); }
    .ct-caption { font-size: 0.8rem; line-height: 1.5; color: var(--color-on-surface-muted); margin: 0; }
    .ct-card { flex: 1; min-height: 0; background: var(--color-surface-elevated); border: 2px solid var(--color-outline-strong); border-radius: var(--rounded-md); padding: 1.2rem 1.4rem; display: flex; flex-direction: column; gap: 0.7rem; overflow-y: auto; max-width: 34rem; }
    .ct-label { font-size: 0.72rem; font-weight: 700; color: var(--color-on-surface); }
    .ct-label small { font-weight: 600; color: var(--color-on-surface-muted); }
    .ct-input, .ct-textarea { width: 100%; font: inherit; font-size: 0.82rem; color: var(--color-on-surface); background: var(--color-surface); border: 1.5px solid var(--color-outline); border-radius: var(--rounded-sm); padding: 0.55rem 0.7rem; }
    .ct-input:focus, .ct-textarea:focus { outline: none; border-color: var(--color-primary); }
    .ct-textarea { min-height: 9rem; resize: vertical; }
    .ct-submit { appearance: none; cursor: pointer; align-self: flex-start; border: 2px solid var(--color-primary); background: var(--color-primary); color: #fff; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.4rem; border-radius: 999px; transition: transform .12s; }
    .ct-submit:hover { transform: translateY(-1px); }
    .ct-submit:disabled { opacity: 0.55; cursor: default; transform: none; }
    .ct-status { font-size: 0.78rem; line-height: 1.5; border-radius: var(--rounded-sm); padding: 0.6rem 0.8rem; }
    .ct-status--ok { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #166534; }
    .ct-status--no { background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; }
    .ct-alt { font-size: 0.72rem; color: var(--color-on-surface-muted); margin: 0; }
    .ct-alt a { color: var(--color-primary-strong); font-weight: 700; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .back-link { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; color: var(--color-primary-strong); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body data-index-root="true">

<main class="index-stage">
  <header class="deck-chrome">
    <span class="deck-chrome__brand">CLAUDE 강의</span>
    <span class="deck-chrome__divider">·</span>
    <span class="deck-chrome__day">문의하기</span>
    <span class="deck-chrome__spacer"></span>
    <a class="back-link" href="../index.html">← 과정 소개로</a>
  </header>

  <section class="ct-head">
    <div class="ct-eyebrow">CONTACT · 문의하기</div>
    <h1 class="ct-title">강의·출강·과정 문의를 남겨 주세요.</h1>
    <p class="ct-caption">로그인 없이 보낼 수 있습니다. 접수 즉시 강사에게 전달되고, 남겨 주신 이메일로 회신드립니다.</p>
  </section>

  <form class="ct-card" id="ct-form">
    <div>
      <div class="ct-label">이름 <small>(선택)</small></div>
      <input class="ct-input" name="name" maxlength="100" autocomplete="name">
    </div>
    <div>
      <div class="ct-label">회신받을 이메일</div>
      <input class="ct-input" name="email" type="email" required maxlength="200" autocomplete="email" placeholder="you@example.com">
    </div>
    <div>
      <div class="ct-label">내용</div>
      <textarea class="ct-textarea" name="message" required maxlength="4000" placeholder="문의 내용을 적어 주세요."></textarea>
    </div>
    <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="ct-status" id="ct-status" hidden></div>
    <button class="ct-submit" type="submit" id="ct-btn">보내기</button>
    <p class="ct-alt">메일이 더 편하시면 — <a href="mailto:xxjjvxb@gmail.com">xxjjvxb@gmail.com</a></p>
  </form>
</main>

<script>
  (function () {
    var form = document.getElementById('ct-form');
    var btn = document.getElementById('ct-btn');
    var status = document.getElementById('ct-status');
    function show(cls, msg) {
      status.className = 'ct-status ' + cls;
      status.textContent = msg;
      status.hidden = false;
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      status.hidden = true;
      var f = new FormData(form);
      fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: f.get('name'), email: f.get('email'), message: f.get('message'), company: f.get('company') }),
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (res.ok) {
          form.reset();
          show('ct-status--ok', '접수됐습니다! 강사에게 바로 전달됐어요. 남겨 주신 이메일로 회신드리겠습니다.');
        } else {
          show('ct-status--no', res.error || '접수에 실패했습니다. 잠시 후 다시 시도하거나 메일로 보내 주세요.');
        }
      }).catch(function () {
        show('ct-status--no', '네트워크 오류로 접수하지 못했습니다. 잠시 후 다시 시도하거나 메일로 보내 주세요.');
      }).finally(function () { btn.disabled = false; });
    });
  })();
</script>
<script defer src="/slide/scripts/feedback.js"></script>
<script defer src="/slide/scripts/analytics.js"></script>
</body>
</html>
